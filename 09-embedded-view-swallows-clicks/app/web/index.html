<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Embedded mode, favorable setup</title>
  <style>
    body { margin: 0; font-family: sans-serif; }
    #header { padding: 20px; background: #eee; border-bottom: 2px solid #ccc; }
    #html-btn { padding: 12px 20px; font-size: 16px; }
    /* Sized by a CSS rule so the cloned placeholder (same id) gets the same size. */
    #flutter-host { width: 100%; height: 360px; }
    #footer { height: 2000px; padding: 20px; background: linear-gradient(#fafafa, #ddd); }
  </style>
</head>
<body>
  <div id="header">
    <button id="html-btn" onclick="window.__clicks = (window.__clicks || 0) + 1; this.textContent = 'HTML clicked: ' + window.__clicks;">HTML header button (0)</button>
  </div>
  <div id="flutter-host"></div>
  <div id="footer">Host page footer</div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
